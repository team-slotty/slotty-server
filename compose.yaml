services:
  mysql:
    image: mysql:8.4
    container_name: slotty-mysql
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: slotty
      MYSQL_USER: slotty
      MYSQL_PASSWORD: localdev
      MYSQL_ROOT_PASSWORD: localdev
      TZ: Asia/Seoul
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql

volumes:
  mysql-data: