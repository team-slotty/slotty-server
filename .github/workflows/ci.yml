name: CI

# dev·main으로 가는 PR과, dev·main에 push(머지)될 때 실행
on:
  pull_request:
    branches: [ dev, main ]
  push:
    branches: [ dev, main ]

jobs:
  test:
    if: github.repository == 'team-slotty/slotty-server' # Classroom(비공개) 레포에서는 실행 안 함 (Actions 요금 문제)
    runs-on: ubuntu-latest

    # contextLoads(통합 테스트)가 실제 MySQL·Redis에 연결하므로 테스트용 컨테이너를 같이 띄움
    # 값은 로컬 compose.yaml과 같게 → application.yaml 기본값(localhost:3307, slotty/localdev) 그대로 동작
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: slotty
          MYSQL_USER: slotty
          MYSQL_PASSWORD: localdev
          MYSQL_ROOT_PASSWORD: localdev
          TZ: Asia/Seoul
        ports:
          - 3307:3306
        # MySQL이 접속을 받을 준비가 될 때까지 기다린 뒤 테스트 시작
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -plocaldev"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
      redis:
        image: redis:7.4
        ports:
          - 6379:6379

    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v4

      - name: Java 21 설치 (+ Gradle 의존성 캐시)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: 빌드·테스트
        run: ./gradlew test --no-daemon

      # 실패했을 때 어떤 테스트가 왜 깨졌는지 HTML 리포트를 내려받아 볼 수 있게
      - name: 테스트 리포트 업로드 (실패 시)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test
          retention-days: 7
